<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Generátor ikony</title></head>
<body style="background:#121316; color:#fff; font-family:sans-serif; text-align:center; padding:30px;">
  <h2>Generátor ikony Koloběžníkovy služby</h2>
  <canvas id="c" width="192" height="192" style="border-radius:30px; margin:20px;"></canvas><br>
  <button id="dl" style="padding:12px 24px; font-weight:bold; background:#ffaa00; border:none; border-radius:8px; font-size:16px;">
    ⬇️ Stáhnout ikonu icon-192.png
  </button>

  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");

    // Pozadí
    ctx.fillStyle = "#1c1e24";
    ctx.fillRect(0, 0, 192, 192);

    // Žlutý kruh
    ctx.strokeStyle = "#ffaa00";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(96, 96, 80, 0, Math.PI * 2);
    ctx.stroke();

    // Text "KS" (Koloběžníkovy Služby)
    ctx.fillStyle = "#ffaa00";
    ctx.font = "bold 65px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("KS", 96, 98);

    document.getElementById("dl").onclick = function() {
      const a = document.createElement("a");
      a.download = "icon-192.png";
      a.href = c.toDataURL("image/png");
      a.click();
    };
  </script>
</body>
</html>
